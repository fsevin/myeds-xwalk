name = "myeds-xwalk-api"
main = "edge/api-proxy.js"
compatibility_date = "2024-09-23"

[dev]
port = 8787

# AEM instance config — safe to commit (no secrets here)
[vars]
AEM_GRAPHQL_URL = "https://author-p42808-e1367915.adobeaemcloud.com/graphql/execute.json/global/getRates"
FIREFLY_CLIENT_ID = "PASTE_CLIENT_ID_HERE"
FIREFLY_SCOPES = "openid,AdobeID,additional_info.projectedProductContext,firefly_api,ff_apis"

# AEM Bearer token — store as a secret, never commit it:
#   npx wrangler secret put AEM_TOKEN
# For local dev, add to a .dev.vars file (git-ignored):
#   AEM_TOKEN=<your-token>

# Firefly client secret — store as a secret, never commit it:
#   npx wrangler secret put FIREFLY_CLIENT_SECRET
# For local dev, add to a .dev.vars file (git-ignored):
#   FIREFLY_CLIENT_SECRET=<your-client-secret>

# After deploying, add a route to serve /api/* from your production domain:
#
# [[routes]]
# pattern = "your-domain.com/api/*"
# zone_name = "your-domain.com"
